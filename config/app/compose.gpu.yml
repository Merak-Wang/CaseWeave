services:
  app:
    environment:
      RETRIEVAL_AGENT_MODEL_DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  app-prepare:
    environment:
      RETRIEVAL_AGENT_MODEL_DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
