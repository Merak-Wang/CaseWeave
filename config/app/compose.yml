# Merge after database/compose.yml and model-service/compose.yml.
x-app: &app
  image: ${RETRIEVAL_AGENT_APP_IMAGE:-retrieval-agent-app:0.1.0}
  build:
    context: ../..
    dockerfile: config/app/Dockerfile
    args:
      MODEL_RUNTIME_IMAGE: ${RETRIEVAL_AGENT_MODEL_IMAGE:-retrieval-agent-model-service:0.1.0-cu128}
      UV_IMAGE: ${CASEWEAVE_BUILD_UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.10@sha256:2bb3ebca0a796a155094a27773d290c4b074572e6107f171d88d086682fd2500}
  init: true
  environment:
    RETRIEVAL_AGENT_MODEL_DEVICE: ${RETRIEVAL_AGENT_MODEL_DEVICE:-cpu}
    RETRIEVAL_AGENT_MODEL_MAX_BATCH_SIZE: ${RETRIEVAL_AGENT_MODEL_MAX_BATCH_SIZE:-16}
    RETRIEVAL_AGENT_MODEL_MAX_TOTAL_TOKENS: ${RETRIEVAL_AGENT_MODEL_MAX_TOTAL_TOKENS:-8192}
    OMP_NUM_THREADS: ${RETRIEVAL_AGENT_MODEL_THREADS:-4}
    RETRIEVAL_AGENT_DELIVERY_ROOT: ${RETRIEVAL_AGENT_DELIVERY_ROOT:-}
    RETRIEVAL_AGENT_STORAGE: mysql_milvus
    RETRIEVAL_AGENT_DATASET_ID: ${RETRIEVAL_AGENT_DATASET_ID:-esft-development}
    RETRIEVAL_AGENT_DATA_PATH: ${RETRIEVAL_AGENT_DATA_PATH:-}
    RETRIEVAL_AGENT_DOCUMENT_PROJECTION: ${RETRIEVAL_AGENT_DOCUMENT_PROJECTION:-ticket-search-projection-v1}
    RETRIEVAL_AGENT_MYSQL_URL: ${RETRIEVAL_AGENT_MYSQL_URL:-mysql://root@mysql:3306/retrieval_agent}
    RETRIEVAL_AGENT_MILVUS_URL: ${RETRIEVAL_AGENT_MILVUS_URL:-http://milvus:19530}
    RETRIEVAL_AGENT_MODEL_SERVICE_URL: http://127.0.0.1:8012
    RETRIEVAL_AGENT_BROWSER_LLM_PROVIDER: ${RETRIEVAL_AGENT_BROWSER_LLM_PROVIDER:-}
    RETRIEVAL_AGENT_BROWSER_LLM_MODEL: ${RETRIEVAL_AGENT_BROWSER_LLM_MODEL:-}
    RETRIEVAL_AGENT_BROWSER_LLM_BASE_URL: ${RETRIEVAL_AGENT_BROWSER_LLM_BASE_URL:-}
    RETRIEVAL_AGENT_BROWSER_LLM_API_KEY_ENV: ${RETRIEVAL_AGENT_BROWSER_LLM_API_KEY_ENV:-}
    RETRIEVAL_AGENT_BROWSER_LLM_API: ${RETRIEVAL_AGENT_BROWSER_LLM_API:-}
    RETRIEVAL_AGENT_BROWSER_LLM_CONTEXT_WINDOW: ${RETRIEVAL_AGENT_BROWSER_LLM_CONTEXT_WINDOW:-}
    RETRIEVAL_AGENT_BROWSER_LLM_MAX_TOKENS: ${RETRIEVAL_AGENT_BROWSER_LLM_MAX_TOKENS:-}
    RETRIEVAL_AGENT_BROWSER_LLM_REASONING: ${RETRIEVAL_AGENT_BROWSER_LLM_REASONING:-off}
    RETRIEVAL_AGENT_MODEL_TRANSPORT_MODULE: ${RETRIEVAL_AGENT_MODEL_TRANSPORT_MODULE:-}
    RETRIEVAL_AGENT_MAIN_MODEL_API_KEY: ${RETRIEVAL_AGENT_MAIN_MODEL_API_KEY:-}
    RETRIEVAL_AGENT_WIKI_LEARNING: ${RETRIEVAL_AGENT_WIKI_LEARNING:-1}
    RETRIEVAL_AGENT_REVIEW_BATCH_SIZE: ${RETRIEVAL_AGENT_REVIEW_BATCH_SIZE:-8}
    RETRIEVAL_AGENT_FILTER_CONFIG: ${RETRIEVAL_AGENT_FILTER_CONFIG:-{}}
    RETRIEVAL_AGENT_TASK_MYSQL_URL: ${RETRIEVAL_AGENT_TASK_MYSQL_URL:-}
  volumes:
    - model-weights:/models:ro
    - model-cache:/cache
    - app-state:/app/.cache
    - app-data:/app/data
    - app-wiki:/app/wiki
    - app-output:/app/output
services:
  app:
    <<: *app
    ports: ['127.0.0.1:${RETRIEVAL_AGENT_WEB_PORT:-3080}:3080']
    depends_on:
      mysql: {condition: service_healthy}
      milvus: {condition: service_healthy}
    restart: on-failure:3
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, '-e', "Promise.all(['http://127.0.0.1:3080/retrieval','http://127.0.0.1:8012/health/ready'].map(u=>fetch(u))).then(rs=>{if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
  app-prepare:
    <<: *app
    profiles: [prepare]
    command: [node, scripts/manage-ticket-data.mjs, all]
volumes:
  app-state:
    name: ${RETRIEVAL_AGENT_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-retrieval-agent-database}}_app-state
    external: ${RETRIEVAL_AGENT_EXISTING_VOLUMES:-false}
  app-data:
    name: ${RETRIEVAL_AGENT_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-retrieval-agent-database}}_app-data
    external: ${RETRIEVAL_AGENT_EXISTING_VOLUMES:-false}
  app-wiki:
    name: ${RETRIEVAL_AGENT_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-retrieval-agent-database}}_app-wiki
    external: ${RETRIEVAL_AGENT_EXISTING_VOLUMES:-false}
  app-output:
    name: ${RETRIEVAL_AGENT_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-retrieval-agent-database}}_app-output
    external: ${RETRIEVAL_AGENT_EXISTING_VOLUMES:-false}
