- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是面向授权用户的只读工单检索 Agent。当前任务状态记录用户要求、已收到的证据与检索进展。
      你负责根据证据判断业务相关性、歧义和搜索充分性；Controller 负责授权、证据身份、合法状态与资源边界。
      遵循共同的检索、分层证据复核与协作规则，通过工具提交判断和完成状态，由工作台生成最终报告与确认工单集合。
    # Compose plugin-owned review and collaboration policies; complete=true
    # silently suppresses them even though their tools remain available.
    complete: false
    includeRuntimeContext: false

- id: retrieval-product
  name: cordis:group
  group: true
  isolate:
    ticketRetrievalProvider: true
    ticketPrincipalProvider: true
    retrievalAgent: true
  config:
    - id: fixture-principal
      name: '@retrieval-agent/bundle/principal'
      config:
        tenantId: !!js process.env.RETRIEVAL_AGENT_TENANT_ID ?? 'demo'
        subjectId: !!js process.env.RETRIEVAL_AGENT_SUBJECT_ID ?? 'development-admin'
        entitlementVersion: !!js process.env.RETRIEVAL_AGENT_ENTITLEMENT_VERSION ?? 'development-admin-v1'
        groups: [admin]
        regions: [cn]
        developmentAdmin: true

    - id: local-provider
      name: '@retrieval-agent/bundle/provider'
      config:
        storageBackend: !!js process.env.RETRIEVAL_AGENT_STORAGE ?? 'jsonl'
        datasetId: !!js process.env.RETRIEVAL_AGENT_DATASET_ID ?? 'esft-development'
        dataPath: !!js process.env.RETRIEVAL_AGENT_DATA_PATH ?? dshHomePath('retrieval-agent', 'data', 'default.jsonl')
        additionalDataPaths: []
        providerId: local-dataset-v1
        maxPageSize: 100
        snapshotTtlMs: 900000
        retrievalMode: hybrid
        modelServiceBaseUrl: !!js process.env.RETRIEVAL_AGENT_MODEL_SERVICE_URL ?? 'http://127.0.0.1:8012'
        embeddingModel: Qwen/Qwen3-Embedding-0.6B
        embeddingRevision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
        embeddingDimensions: 1024
        # 在线单次排名保留 deadline；冷索引准备不设任何时间上限。
        modelDeadlineMs: 120000
        preparePollIntervalMs: !!js Number(process.env.RETRIEVAL_AGENT_INDEX_PROGRESS_INTERVAL_MS ?? 1000)
        # Dense 只提供语义补充候选；关键词合格集合不受此上限影响。
        denseTopK: 15
        rerankerEnabled: !!js process.env.RETRIEVAL_AGENT_RERANKER_ENABLED === 'true'
        rerankerModel: Qwen/Qwen3-Reranker-0.6B
        rerankerRevision: e61197ed45024b0ed8a2d74b80b4d909f1255473
        allowKeywordFallback: false

    - id: retrieval-agent
      name: '@retrieval-agent/bundle/agent'
      config:
        # 跨动作总页上限覆盖关键词全集与 Dense Top-15 的融合候选；单动作仍至多推进一页，且它不是最终结果条数上限。
        # 模型步数与墙钟时间只观测记录，不再终止任务。
        maxSearches: 2500
        taskPersistence: !!js "process.env.RETRIEVAL_AGENT_STORAGE === 'mysql_milvus' ? 'mysql' : 'session'"
        searchTopK: 20
        searchMaxScan: 50000
        queryAnalysisBaseUrl: !!js process.env.RETRIEVAL_AGENT_MODEL_SERVICE_URL ?? 'http://127.0.0.1:8012'
        queryAnalysisDeadlineMs: 5000
        wikiRoot: !!js process.env.RETRIEVAL_AGENT_WIKI_ROOT
        wikiLearning: !!js process.env.RETRIEVAL_AGENT_WIKI_LEARNING !== '0'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.7
        retainTokens: 384
        maxTokens: 256
        compactionRetries: 1
        maxOverflowRetries: 1
        auto: true
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 6000
        headChars: 3200
        tailChars: 600
