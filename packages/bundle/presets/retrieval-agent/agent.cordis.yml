- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是面向授权用户的只读工单检索 Agent。Harness 已在第一次模型请求前编译类型化 Query
      Contract、打开单一授权快照并完成固定的 Hybrid 首检；只能依据当前请求中的状态快照行动。

      每次搜索或证据读取后，必须调用 ticket_assess_state，并只提交一个判别式 outcome。候选只用
      c1、c2 等稳定短别名，不得生成或复述不透明引用。省略 keep_aliases 表示保留所有未被本次
      新排除的活跃候选。system gaps 只读，semantic_gaps 才由模型判断。必须遵循 allowedActions；
      Provider 游标、权限、历史选择、排除、预算与停止语义均由 Harness 决定。接受 Top-K 只表示
      本次选择完成，不表示数据源已穷尽。

      不得补造工单事实，不得输出自然语言最终答案、总结或建议。证据不足、权限不足、预算耗尽、
      快照失效或来源错误时应显式收敛；最终产品输出只能是 Harness 冻结的结构化工单集合。
    complete: true
    includeRuntimeContext: false

- id: retrieval-product
  name: cordis:group
  group: true
  isolate:
    ticketRetrievalProvider: true
    ticketPrincipalProvider: true
    retrievalAgent: true
  config:
    - id: fixture-principal
      name: '@retrieval-agent/bundle/principal'
      config:
        tenantId: !!js process.env.RETRIEVAL_AGENT_TENANT_ID ?? 'demo'
        subjectId: !!js process.env.RETRIEVAL_AGENT_SUBJECT_ID ?? 'development-admin'
        entitlementVersion: !!js process.env.RETRIEVAL_AGENT_ENTITLEMENT_VERSION ?? 'development-admin-v1'
        groups: [admin]
        regions: [cn]
        developmentAdmin: true

    - id: local-provider
      name: '@retrieval-agent/bundle/provider'
      config:
        dataPath: !!js process.env.RETRIEVAL_AGENT_DATA_PATH ?? dshHomePath('retrieval-agent', 'data', 'tickets.jsonl')
        additionalDataPaths:
          - !!js dshHomePath('retrieval-agent', 'data', 'public', 'fcc-1000-seed-20260825.jsonl')
          - !!js dshHomePath('retrieval-agent', 'data', 'public', 'bitext-1000-seed-20260825.jsonl')
        providerId: local-dataset-v1
        defaultRequestedCount: 5
        maxRequestedCount: 20
        snapshotTtlMs: 900000
        retrievalMode: hybrid
        modelServiceBaseUrl: !!js process.env.RETRIEVAL_AGENT_MODEL_SERVICE_URL ?? 'http://127.0.0.1:8012'
        embeddingModel: Qwen/Qwen3-Embedding-0.6B
        embeddingRevision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
        embeddingDimensions: 1024
        modelDeadlineMs: 120000
        vectorCacheDir: !!js process.env.RETRIEVAL_AGENT_VECTOR_CACHE_DIR ?? dshHomePath('retrieval-agent', 'cache', 'vectors')
        rerankerEnabled: !!js process.env.RETRIEVAL_AGENT_RERANKER_ENABLED === 'true'
        rerankerModel: Qwen/Qwen3-Reranker-0.6B
        rerankerRevision: e61197ed45024b0ed8a2d74b80b4d909f1255473
        allowKeywordFallback: false

    - id: retrieval-agent
      name: '@retrieval-agent/bundle/agent'
      config:
        maxRounds: 8
        maxSearches: 4
        maxPromotions: 3
        maxEvidenceTokens: 1500
        maxLatencyMs: 120000
        noProgressLimit: 2
        searchTopK: 8
        searchMaxScan: 50000
        contextTokenBudget: 1500
        maxContextTokens: 4096
        adaptiveMaxResults: 20

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.7
        retainTokens: 384
        maxTokens: 256
        compactionRetries: 1
        maxOverflowRetries: 1
        auto: true
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 6000
        headChars: 3200
        tailChars: 600
