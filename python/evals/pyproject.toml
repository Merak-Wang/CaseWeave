[project]
name = "retrieval-agent-evals"
version = "0.1.0"
description = "External deterministic evaluation contracts and scorers for CaseWeave"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_agent_evals"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
