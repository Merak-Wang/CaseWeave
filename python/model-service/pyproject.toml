[project]
name = "retrieval-agent-model-service"
version = "0.1.0"
description = "Long-lived local Qwen embedding and reranking data plane for Retrieval Agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
retrieval-agent-model-service = "retrieval_agent_model_service.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]
runtime = [
  "huggingface-hub==0.36.2",
  "torch==2.9.1",
  "transformers==4.57.6"
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_agent_model_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
