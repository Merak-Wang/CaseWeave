[project]
name = "retrieval-agent-model-service"
version = "0.1.0"
description = "Long-lived uv/FastAPI data plane for query analysis, RAG ranking/policy, Qwen inference, and vector caching"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
retrieval-agent-model-service = "retrieval_agent_model_service.cli:main"

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]
runtime = [
  "fastapi==0.141.1",
  "huggingface-hub==0.36.2",
  "numpy==2.5.2",
  "spacy==3.8.7",
  "torch==2.9.1",
  "transformers==4.57.6",
  "uvicorn==0.52.4",
  "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl"
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_agent_model_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
